<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Solar Interativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Saira:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --void:#04061a;
  --deep:#0a0f33;
  --panel:rgba(12,16,44,.88);
  --line:rgba(170,185,255,.14);
  --line-strong:rgba(170,185,255,.28);
  --ink:#e9ecff;
  --muted:#8c93c2;
  --dim:#5a6192;
  --sun:#ffc54d;
  --sun-hot:#ff7a1f;
  --accent:#7fa8ff;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--ink);font-family:var(--body);
  overflow:hidden;-webkit-user-select:none;user-select:none;
}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;
  background:radial-gradient(ellipse at 50% 50%,#0d1440 0%,var(--void) 55%,#010208 100%)}
.app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-inline:16px}

header{padding-block:14px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,34px);letter-spacing:.02em;text-wrap:balance;
  background:linear-gradient(90deg,#ffe3a1,var(--sun) 45%,var(--sun-hot));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;min-height:32px}
.clock b{display:block;color:var(--ink);font-weight:500;font-size:15px}

.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
#orrery{width:100%;height:100%;max-height:100%;display:block;overflow:visible}
.orbit{fill:none;stroke:rgba(170,185,255,.09);stroke-width:1;transition:stroke .25s}
.orbit.on{stroke-width:1.6}
.planet{cursor:pointer}
.planet .body{transition:transform .2s}
.planet:hover .body,.planet:focus-visible .body{transform:scale(1.45)}
.planet:focus{outline:none}
.planet:focus-visible .hit{stroke:var(--accent);stroke-width:1.5}
.planet .tag{font-family:var(--body);font-size:11px;fill:var(--muted);opacity:0;transition:opacity .2s;pointer-events:none}
.planet:hover .tag,.planet.on .tag,.show-names .planet .tag{opacity:1}
.planet.on .tag{fill:var(--ink)}

/* Planet list */
.list{position:absolute;top:8px;left:0;z-index:5;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px}
.list h2{margin:0 0 4px;font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:center}
.list button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:13px;color:var(--muted)}
.list button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.list button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.list button.on{background:rgba(255,255,255,.11);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* Info panel */
.info{position:absolute;top:8px;right:0;z-index:6;width:min(320px,100%);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;animation:slide .28s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.info-head{display:flex;align-items:center;gap:12px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.swatch{width:38px;height:38px;border-radius:50%;flex:none}
.info-head h3{margin:0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.info-head small{display:block;margin-top:3px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.close{all:unset;cursor:pointer;margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--muted)}
.close:hover{background:rgba(255,90,90,.25);color:var(--ink)}
.close:focus-visible{outline:2px solid var(--accent)}
.info p.desc{margin:0;padding:10px 12px 8px;font-size:13px;line-height:1.55;color:#c9cdf0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:0 12px;border-radius:8px;overflow:hidden}
.facts div{background:rgba(8,11,34,.9);padding:8px 10px}
.facts dt{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.facts dd{margin:2px 0 0;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.facts div.wide{grid-column:1/-1}
.fact{margin:10px 12px 12px;padding:9px 10px;border-radius:8px;background:rgba(255,197,77,.06);border:1px solid rgba(255,197,77,.16);font-size:12.5px;line-height:1.5;color:#d6d9f4}
.fact b{color:var(--sun);font-weight:600}

/* Controls */
.controls{padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 18px;position:relative;z-index:4}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(255,255,255,.06);font-size:13px;font-weight:500}
.btn:hover{background:rgba(255,255,255,.12)}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn[aria-pressed="true"]{background:var(--accent);color:#06102e;border-color:var(--accent)}
.belt-rock{fill:#9a8f7a}
.sign{position:absolute;right:0;bottom:6px;z-index:3;text-align:right;pointer-events:none;
  font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.04em;color:rgba(233,236,255,.62);line-height:1.15}
.sign span{display:block;font-family:var(--body);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
@media (max-width:720px){.sign{bottom:2px;font-size:13px}}
.group{display:flex;align-items:center;gap:8px}
.group>span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.seg button{all:unset;cursor:pointer;padding:5px 9px;border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.seg button:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.seg button.on{background:var(--accent);color:#06102e;font-weight:500}
.seg.text button{font-family:var(--body);font-size:12px}

@media (max-width:720px){
  .list{flex-direction:row;flex-wrap:wrap;justify-content:center;left:0;right:0;top:0;padding:6px;gap:2px}
  .list h2{display:none}
  .list button{padding:4px 6px}
  .list button span{display:none}
  .list .dot{width:14px;height:14px}
  .info{top:auto;bottom:0;left:0;right:0;width:auto;max-height:62%;overflow:auto}
  .clock{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  .info{animation:none}
  .planet .body{transition:none}
}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <div>
      <h1>Sistema Solar Interativo</h1>
      <p class="sub">Clique em um planeta para ver os detalhes</p>
    </div>
    <div class="clock" id="clock" aria-live="off"></div>
  </header>

  <main class="stage" id="stage">
    <nav class="list" id="list" aria-label="Planetas"><h2>Planetas</h2></nav>
    <svg id="orrery" viewBox="-380 -380 760 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Órbitas dos oito planetas em torno do Sol">
      <defs>
        <radialGradient id="sunGrad">
          <stop offset="0" stop-color="#fffbe6"/>
          <stop offset=".3" stop-color="#ffd700"/>
          <stop offset=".62" stop-color="#ff8c00"/>
          <stop offset="1" stop-color="#ff4500"/>
        </radialGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#ffcc33" stop-opacity=".55"/>
          <stop offset=".45" stop-color="#ff8c00" stop-opacity=".18"/>
          <stop offset="1" stop-color="#ff4500" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="orbits"></g>
      <g id="belt" aria-hidden="true"></g>
      <circle r="70" fill="url(#sunGlow)"/>
      <circle r="22" fill="url(#sunGrad)" id="sun" style="cursor:pointer"><title>Sol</title></circle>
      <g id="planets"></g>
    </svg>
    <aside class="info" id="info" hidden aria-live="polite"></aside>
    <div class="sign">Iderlan Freitas<span>Engenheiro Eletricista</span></div>
  </main>

  <div class="controls">
    <button class="btn" id="play" type="button"></button>
    <div class="group">
      <span>Velocidade</span>
      <div class="seg" id="speeds" role="group" aria-label="Velocidade"></div>
    </div>
    <div class="group">
      <span>Movimento</span>
      <div class="seg text" id="modes" role="group" aria-label="Escala de movimento">
        <button type="button" data-mode="visual" title="Velocidades comprimidas para que todos os planetas se movam de forma visível">Didático</button>
        <button type="button" data-mode="real" title="Velocidades angulares proporcionais aos períodos orbitais reais">Proporcional</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
const planets = [
  {name:'Mercúrio',en:'Mercury',color:'#b5b5b5',size:6,diam:'4.879 km',dist:'57,9 milhões km',per:'88 dias',days:87.97,r:55,speed:4.15,
   desc:'O menor planeta do sistema solar e o mais próximo do Sol. Sua superfície é coberta por crateras, semelhante à Lua.',
   fact:'Mercúrio gira em torno de si em 59 dias, mas um dia solar completo (de um nascer do Sol ao seguinte) dura 176 dias terrestres, o dobro do seu ano de 88 dias.'},
  {name:'Vênus',en:'Venus',color:'#e8cda0',size:10,diam:'12.104 km',dist:'108,2 milhões km',per:'225 dias',days:224.7,r:80,speed:1.62,
   desc:'O planeta mais quente do sistema solar, com temperatura média de 462 °C. Sua atmosfera densa de CO₂ cria um efeito estufa extremo.',
   fact:'Vênus gira ao contrário: o Sol nasce no oeste e se põe no leste. É mais quente que Mercúrio, mesmo estando mais longe do Sol.'},
  {name:'Terra',en:'Earth',color:'#4da6ff',size:11,diam:'12.756 km',dist:'149,6 milhões km',per:'365,25 dias',days:365.25,r:110,speed:1,
   desc:'Nosso lar. O único planeta conhecido com vida e água líquida na superfície. Possui um satélite natural: a Lua.',
   fact:'A Terra é o único planeta cujo nome não vem de um deus da mitologia greco-romana.'},
  {name:'Marte',en:'Mars',color:'#e07050',size:8,diam:'6.792 km',dist:'227,9 milhões km',per:'687 dias',days:686.98,r:145,speed:.53,
   desc:'O Planeta Vermelho possui o maior vulcão do sistema solar, o Monte Olimpo, e evidências de água líquida no passado.',
   fact:'O Monte Olimpo tem cerca de 21 km de altura, quase 2,5 vezes a altura do Everest.'},
  {name:'Júpiter',en:'Jupiter',color:'#c8a060',size:24,diam:'142.984 km',dist:'778,6 milhões km',per:'11,86 anos',days:4332.6,r:195,speed:.084,
   desc:'O maior planeta do sistema solar. É um gigante gasoso com a Grande Mancha Vermelha, uma tempestade observada há séculos.',
   fact:'Júpiter tem mais que o dobro da massa de todos os outros planetas somados.'},
  {name:'Saturno',en:'Saturn',color:'#e8d088',size:20,diam:'120.536 km',dist:'1,434 bilhão km',per:'29,46 anos',days:10759,r:250,speed:.034,
   desc:'Famoso pelos anéis formados por bilhões de partículas de gelo e rocha. Tem mais de 270 luas confirmadas, o maior número do sistema solar.',
   fact:'Saturno é tão pouco denso que flutuaria na água, se existisse um oceano grande o suficiente.'},
  {name:'Urano',en:'Uranus',color:'#7ec8e3',size:15,diam:'51.118 km',dist:'2,871 bilhões km',per:'84,01 anos',days:30687,r:305,speed:.012,
   desc:'Um gigante de gelo que gira praticamente deitado, com inclinação axial de 98°.',
   fact:'Urano foi o primeiro planeta descoberto com telescópio, por William Herschel em 1781.'},
  {name:'Netuno',en:'Neptune',color:'#4060e0',size:14,diam:'49.528 km',dist:'4,495 bilhões km',per:'164,8 anos',days:60190,r:350,speed:.006,
   desc:'O planeta mais distante do Sol, com os ventos mais fortes do sistema solar, que chegam a 2.100 km/h.',
   fact:'Netuno foi o primeiro planeta encontrado por cálculo matemático, antes de ser observado em 1846.'}
];

const NS='http://www.w3.org/2000/svg';
const sunInfo={name:'Sol',en:'Sun',color:'#ffc54d',kind:'Estrela anã amarela (G2V)',diam:'1.392.700 km',per:'—',dist:'—',
  desc:'A estrela no centro do sistema solar concentra 99,86% de toda a massa do sistema. Sua superfície fica perto de 5.500 °C e o núcleo passa de 15 milhões °C.',
  fact:'A luz do Sol leva cerca de 8 minutos e 20 segundos para chegar à Terra.',
  extra:[['Idade','~4,6 bilhões de anos'],['Temperatura superficial','~5.500 °C']]};
const kmOf=s=>+s.replace(/\D/g,'');
const EARTH_KM=12756;
function sizeVsEarth(p){
  const x=kmOf(p.diam)/EARTH_KM;
  if(Math.abs(x-1)<.01) return 'referência';
  return x.toLocaleString('pt-BR',{maximumFractionDigits:x<10?2:1})+'× a Terra';
}
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const $=id=>document.getElementById(id);

// Base angular rate: Earth completes one orbit in ~12.6 s at 1x.
const BASE=0.5;
const visualRate=p=>Math.pow(p.speed,0.35);
let mode='visual', speed=1, playing=true, selected=null;
let angles=planets.map((_,i)=>i*Math.PI*2/planets.length+Math.random()*.5);
let simDays=0;

// Build orbits and planets
const gOrb=$('orbits'), gPl=$('planets'), nodes=[];
planets.forEach((p,i)=>{
  const orb=el('circle',{r:p.r,class:'orbit'},gOrb);
  const g=el('g',{class:'planet',tabindex:'0',role:'button','aria-label':p.name},gPl);
  el('circle',{r:Math.max(p.size/2+6,10),fill:'transparent',class:'hit'},g);
  const body=el('g',{class:'body'},g);
  const grad=el('radialGradient',{id:'pg'+i,cx:'.35',cy:'.35',r:'.7'},document.querySelector('defs'));
  el('stop',{offset:'0','stop-color':p.color},grad);
  el('stop',{offset:'.6','stop-color':p.color,'stop-opacity':'.72'},grad);
  el('stop',{offset:'1','stop-color':p.color,'stop-opacity':'.38'},grad);
  const halo=el('circle',{r:p.size/2+3,fill:p.color,opacity:'0'},body);
  if(p.name==='Saturno'){
    el('ellipse',{rx:p.size,ry:p.size*.3,fill:'none',stroke:p.color,'stroke-opacity':'.5','stroke-width':'2',transform:'rotate(-20)'},body);
  }
  el('circle',{r:p.size/2,fill:`url(#pg${i})`},body);
  if(p.name==='Saturno'){ // front half of ring
    el('path',{d:`M ${-p.size} 0 A ${p.size} ${p.size*.3} 0 0 0 ${p.size} 0`,fill:'none',stroke:p.color,'stroke-opacity':'.75','stroke-width':'2',transform:'rotate(-20)'},body);
  }
  const tag=el('text',{class:'tag','text-anchor':'middle',y:p.size/2+14},g);
  tag.textContent=p.name;
  g.addEventListener('click',e=>{e.stopPropagation();select(selected===i?null:i)});
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(selected===i?null:i)}});
  nodes.push({g,orb,halo});
});
$('sun').addEventListener('click',()=>select(selected==='sun'?null:'sun'));

// Earth's Moon
const earthG=nodes[2].g;
el('circle',{r:12,fill:'none',stroke:'rgba(200,210,255,.12)','stroke-width':'.6'},earthG);
const moon=el('circle',{r:1.8,fill:'#d8d8d8'},earthG);
let moonAngle=0;

// Asteroid belt between Mars and Jupiter
const belt=$('belt');
for(let k=0;k<260;k++){
  const a=Math.random()*Math.PI*2, r=160+Math.random()*16+ (Math.random()-.5)*4;
  el('circle',{class:'belt-rock',cx:(Math.cos(a)*r).toFixed(1),cy:(Math.sin(a)*r).toFixed(1),r:(Math.random()*.9+.35).toFixed(2),opacity:(Math.random()*.5+.25).toFixed(2)},belt);
}
let beltAngle=0;

// Sidebar list
const list=$('list'), listBtns=planets.map((p,i)=>{
  const b=document.createElement('button');b.type='button';
  b.innerHTML=`<i class="dot" style="background:${p.color}"></i><span>${p.name}</span>`;
  b.setAttribute('aria-label',p.name);
  b.onclick=()=>select(selected===i?null:i);
  list.appendChild(b);return b;
});

function select(i){
  selected=i;
  nodes.forEach((n,k)=>{
    const on=k===i, c=planets[k].color;
    n.g.classList.toggle('on',on);
    n.orb.classList.toggle('on',on);
    n.orb.style.stroke=on?c+'66':'';
    n.halo.setAttribute('opacity',on?'.28':'0');
    listBtns[k].classList.toggle('on',on);
    listBtns[k].querySelector('.dot').style.boxShadow=on?`0 0 8px ${c}`:'none';
  });
  const box=$('info');
  if(i==null){box.hidden=true;return}
  const isSun=i==='sun';
  const p=isSun?sunInfo:planets[i];
  const sub=isSun?`${p.en} · ${p.kind}`:`${p.en} · ${i+1}º planeta a partir do Sol`;
  const cells=isSun
    ?[['Diâmetro',p.diam],['Tamanho',sizeVsEarth(p)],...p.extra]
    :[['Diâmetro',p.diam],['Tamanho',sizeVsEarth(p)],['Período orbital',p.per],['Distância média do Sol',p.dist]];
  box.innerHTML=`
    <div class="info-head">
      <div class="swatch" style="background:radial-gradient(circle at 30% 30%,${p.color},${p.color}77);box-shadow:0 0 14px ${p.color}55"></div>
      <div><h3>${p.name}</h3><small>${sub}</small></div>
      <button class="close" type="button" aria-label="Fechar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 18 18 6M6 6l12 12"/></svg></button>
    </div>
    <p class="desc">${p.desc}</p>
    <dl class="facts">
      ${cells.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}
    </dl>
    <div class="fact"><b>Curiosidade:</b> ${p.fact}</div>`;
  box.querySelector('.close').onclick=()=>select(null);
  box.hidden=false;
  box.style.animation='none';void box.offsetWidth;box.style.animation='';
}

// Controls
const playBtn=$('play');
function renderPlay(){
  playBtn.innerHTML=playing
    ?'<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>Pausar'
    :'<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>Reproduzir';
}
playBtn.onclick=()=>{playing=!playing;last=0;renderPlay()};
renderPlay();


const speedsBox=$('speeds');
[0.25,0.5,1,2,5,10].forEach(s=>{
  const b=document.createElement('button');b.type='button';b.textContent=s+'x';b.dataset.s=s;
  b.onclick=()=>{speed=s;syncSeg()};speedsBox.appendChild(b);
});
$('modes').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;syncSeg()});
function syncSeg(){
  speedsBox.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.s===speed));
  $('modes').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
}
syncSeg();

// Clock: simulated Earth time (only meaningful in proportional mode)
const clock=$('clock');
function fmtDays(d){
  const y=Math.floor(d/365.25), r=Math.floor(d-y*365.25);
  return (y?`${y} ano${y>1?'s':''} e `:'')+`${r} dia${r===1?'':'s'}`;
}
function renderClock(){
  clock.innerHTML=mode==='real'
    ?`Tempo simulado<b>${fmtDays(simDays)}</b>`
    :`Modo didático<b>velocidades comprimidas</b>`;
}

// Animation
let last=0;
function place(){
  planets.forEach((p,i)=>{
    const x=Math.cos(angles[i])*p.r, y=Math.sin(angles[i])*p.r;
    nodes[i].g.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)})`);
  });
}
function frame(t){
  if(playing){
    if(!last)last=t;
    const dt=Math.min(.1,(t-last)/1000);last=t;
    planets.forEach((p,i)=>{
      const rate=mode==='real'?p.speed:visualRate(p);
      angles[i]+=rate*speed*dt*BASE;
    });
    if(mode==='real') simDays+=speed*dt*BASE/(2*Math.PI)*365.25;
    const moonRate=mode==='real'?13.37:Math.pow(13.37,.35);
    moonAngle+=moonRate*speed*dt*BASE;
    moon.setAttribute('cx',(Math.cos(moonAngle)*12).toFixed(2));
    moon.setAttribute('cy',(Math.sin(moonAngle)*12).toFixed(2));
    beltAngle+=(mode==='real'?.22:Math.pow(.22,.35))*speed*dt*BASE;
    belt.setAttribute('transform',`rotate(${(beltAngle*180/Math.PI).toFixed(2)})`);
    place();
  }
  renderClock();
  requestAnimationFrame(frame);
}
place();
requestAnimationFrame(frame);

// Starfield
const sky=$('sky'), ctx=sky.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stars=Array.from({length:180},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.4+.3,o:Math.random()*.6+.3,f:Math.random()*.6+.25,ph:Math.random()*6.28}));
function resize(){const d=devicePixelRatio||1;sky.width=innerWidth*d;sky.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
function drawSky(t){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of stars){
    const tw=reduce?1:.55+.45*Math.sin(t/1000*s.f*2+s.ph);
    ctx.globalAlpha=s.o*tw;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x*innerWidth,s.y*innerHeight,s.s,0,6.283);ctx.fill();
  }
  if(!reduce)requestAnimationFrame(drawSky);
}
addEventListener('resize',()=>{resize();if(reduce)drawSky(0)});
resize();requestAnimationFrame(drawSky);
})();
</script>
